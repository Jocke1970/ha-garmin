name: Gear M2 device battery temp

on:
  push:
    branches:
      - feature/garmin-gear
    paths:
      - .gear-m2-device-battery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Patch registered-device battery plumbing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path("src/ha_garmin/client.py")
          text = client.read_text(encoding="utf-8")
          old = '''    "currentFirmwareVersion",\n    "actualProductSku",\n    "wifi",\n}'''
          new = '''    "currentFirmwareVersion",\n    "actualProductSku",\n    "batteryLevel",\n    "batteryStatus",\n    "wifi",\n}'''
          assert old in text, "DEVICE_ESSENTIAL_KEYS anchor not found"
          text = text.replace(old, new, 1)
          client.write_text(text, encoding="utf-8")

          gear = Path("src/ha_garmin/gear.py")
          text = gear.read_text(encoding="utf-8")
          old = '''        "firmware": device.get("currentFirmwareVersion"),\n        "primary": device.get("primary"),'''
          new = '''        "firmware": device.get("currentFirmwareVersion"),\n        "battery_level": device.get("batteryLevel"),\n        "battery_status": device.get("batteryStatus"),\n        "primary": device.get("primary"),'''
          assert old in text, "device metadata anchor not found"
          text = text.replace(old, new, 1)
          gear.write_text(text, encoding="utf-8")

          tests = Path("tests/test_client.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''        assert len(devices) == 1\n        assert devices[0]["displayName"] == "Forerunner 955"\n        assert devices[0]["batteryLevel"] == 85\n\n'''
          addition = '''        assert len(devices) == 1\n        assert devices[0]["displayName"] == "Forerunner 955"\n        assert devices[0]["batteryLevel"] == 85\n\n    def test_trim_device_keeps_battery_fields(self):\n        """Registered-device trim must retain Garmin battery level and status."""\n        from ha_garmin.client import _trim_device\n\n        trimmed = _trim_device(\n            {\n                "deviceId": 123,\n                "displayName": "Fenix 7 Pro",\n                "batteryLevel": 67,\n                "batteryStatus": "GOOD",\n                "someCapabilityFlag": True,\n            }\n        )\n\n        assert trimmed["batteryLevel"] == 67\n        assert trimmed["batteryStatus"] == "GOOD"\n        assert "someCapabilityFlag" not in trimmed\n\n'''
          assert anchor in text, "test_get_devices anchor not found"
          text = text.replace(anchor, addition, 1)
          tests.write_text(text, encoding="utf-8")

          tests = Path("tests/test_gear.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''    assert record["last_seen_at"] is None\n    assert record["activity_count"] is None\n\n\ndef test_sensor_serial_is_hashed_and_last_connected_is_last_seen_only() -> None:\n'''
          addition = '''    assert record["last_seen_at"] is None\n    assert record["activity_count"] is None\n\n\ndef test_device_battery_is_preserved_in_source_metadata() -> None:\n    data = {\n        "devices": [\n            {\n                "deviceId": 456,\n                "productDisplayName": "Fenix 7 Pro",\n                "batteryLevel": 61,\n                "batteryStatus": "GOOD",\n            }\n        ]\n    }\n\n    record = build_gear_source_records(data)[0]\n\n    assert record["source"] == "garmin_device"\n    assert record["metadata"]["battery_level"] == 61\n    assert record["metadata"]["battery_status"] == "GOOD"\n\n\ndef test_sensor_serial_is_hashed_and_last_connected_is_last_seen_only() -> None:\n'''
          assert anchor in text, "test_gear device anchor not found"
          text = text.replace(anchor, addition, 1)
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format
        run: ruff format src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest tests/test_client.py tests/test_gear.py -q

      - name: Remove one-shot files and commit
        shell: bash
        run: |
          rm -f .gear-m2-device-battery .github/workflows/gear-m2-device-battery-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(gear): preserve registered-device battery data"
          git push
