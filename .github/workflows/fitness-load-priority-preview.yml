name: Fitness Load Priority Preview

on:
  push:
    branches:
      - experiment/fitness-load-priority-preview
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check src/ha_garmin/fitness/load_priority_preview.py tests/test_fitness_load_priority_preview.py
      - name: Lint
        run: ruff check src/ha_garmin/fitness/load_priority_preview.py tests/test_fitness_load_priority_preview.py
      - name: Type check
        run: mypy src/ha_garmin/fitness/load_priority_preview.py
      - name: Tests
        run: pytest tests/ -q
