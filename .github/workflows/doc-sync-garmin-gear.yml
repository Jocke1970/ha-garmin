name: One-shot Garmin Gear Doc Sync

on:
  push:
    paths:
      - ".github/workflows/doc-sync-garmin-gear.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Gear documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          feature_anchor = "- **Data transformations** - automatic unit conversions (seconds→minutes, grams→kg)\n"
          feature_new = feature_anchor + "- **Dynamic activity type registry** - learns Garmin `typeId`/`typeKey`/`parentTypeId` from normal activity data and refreshes the canonical hierarchy on a 24-hour cache\n- **Activity-driven Gear metadata** - maps recent activities to Gear with bounded/cached lookups instead of polling every Gear item\n"
          if feature_anchor not in text:
              raise SystemExit("Features anchor not found")
          text = text.replace(feature_anchor, feature_new, 1)

          coordinator_anchor = "| `fetch_gear_data()` | 6+ | Gear items, stats, device alarms, solar intensity, devices, last sync |\n"
          coordinator_new = coordinator_anchor + "\n> `fetch_gear_data()` also performs a best-effort activity-type hierarchy bootstrap when its 24-hour cache is stale. Normal recent activity fetches teach the registry at no additional API cost.\n"
          if coordinator_anchor not in text:
              raise SystemExit("Coordinator table anchor not found")
          text = text.replace(coordinator_anchor, coordinator_new, 1)

          write_anchor = "## Write / Action Methods\n"
          gear_section = '''## Gear and Activity Type Enrichment

`ha-garmin` enriches Gear from the existing Activity flow rather than polling every Gear item for history.

The dynamic Activity Type Registry stores Garmin's stable `typeId`, `typeKey`, and `parentTypeId` fields. It learns types for free from normal activity responses and uses Garmin's canonical activity-type hierarchy as a best-effort 24-hour cached bootstrap. This resolves Gear defaults such as `type_25` into stable keys such as `indoor_cycling` while still preserving the hierarchy in `defaultForActivityDetails`.

The Activity fetch also scans its current recent-activity window newest-to-oldest and calls `get_activity_gear(activity_id)` for activities whose Gear mapping is not already cached. Matching Gear receives a compact `lastActivity` payload containing the activity ID, name, type metadata, UTC start time, distance, and duration when available.

Request behaviour is intentionally bounded:

- activity-to-Gear results are cached per activity ID;
- after the recent window is primed, normal operation is roughly one additional Gear lookup when a new activity appears;
- the newest activity can retry an empty Gear association up to three times to allow Garmin propagation delay;
- older empty results are treated as stable after one lookup;
- auxiliary activity-type or Gear lookup failures do not fail the primary coordinator data.

The current Home Assistant integration uses a 10-activity recent window for bootstrap/backfill. Gear last used outside that window can therefore have historical usage statistics without a cached `lastActivity` until it is used again.

'''
          if write_anchor not in text:
              raise SystemExit("Write methods anchor not found")
          text = text.replace(write_anchor, gear_section + write_anchor, 1)

          activities_row = "| `get_activities()` | Most recent activities (newest first, no date filter) |\n"
          activities_new = activities_row + "| `get_activity_types()` | Cached Garmin activity type hierarchy (`typeId`, `typeKey`, `parentTypeId`) |\n| `get_activity_gear(activity_id)` | Gear associated with one Garmin activity |\n"
          if activities_row not in text:
              raise SystemExit("Activities methods anchor not found")
          text = text.replace(activities_row, activities_new, 1)

          path.write_text(text)
          PY

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: document activity-driven Gear metadata"
          git push origin HEAD:main
