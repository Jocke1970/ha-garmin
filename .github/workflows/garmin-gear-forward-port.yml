name: Garmin Gear M1 validation

on:
  push:
    branches: [feature/garmin-gear]
    paths:
      - .github/workflows/garmin-gear-forward-port.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/garmin-gear

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Wire normalized Gear records
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path("src/ha_garmin/client.py")
          text = client.read_text()
          old = '    "deviceCategories",\n    "wifi",\n}'
          new = '    "deviceCategories",\n    "deviceTypePk",\n    "deviceTypeName",\n    "deviceStatus",\n    "currentFirmwareVersion",\n    "actualProductSku",\n    "wifi",\n}'
          if old in text:
              text = text.replace(old, new, 1)
          client.write_text(text)

          activity_types = Path("src/ha_garmin/activity_types.py")
          text = activity_types.read_text()
          anchor = 'from .exceptions import GarminConnectError\n'
          import_line = 'from .gear import build_gear_source_records\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("activity_types import anchor missing")
              text = text.replace(anchor, anchor + import_line, 1)
          old = '        data["activityTypes"] = activity_types\n        return data\n'
          new = '        data["activityTypes"] = activity_types\n        data["gearRecords"] = build_gear_source_records(\n            data, self._recent_activities_raw\n        )\n        return data\n'
          if 'data["gearRecords"]' not in text:
              if old not in text:
                  raise SystemExit("activity_types return anchor missing")
              text = text.replace(old, new, 1)
          activity_types.write_text(text)

          init = Path("src/ha_garmin/__init__.py")
          text = init.read_text()
          import_line = 'from .gear import GearItem, GearSourceRecord, build_gear_source_records\n'
          if import_line not in text:
              anchor = 'from .history import GarminHistoryClient, TrimpTrainingContext\n'
              if anchor not in text:
                  raise SystemExit("__init__ import anchor missing")
              text = text.replace(anchor, import_line + anchor, 1)
          for symbol in ("GearItem", "GearSourceRecord", "build_gear_source_records"):
              quoted = f'    "{symbol}",\n'
              if quoted not in text:
                  marker = '    "TrimpTrainingContext",\n'
                  text = text.replace(marker, marker + quoted, 1)
          init.write_text(text)
          PY

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate M1 source model
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          mypy src
          pytest -q

      - name: Commit validated wiring and remove workflow
        run: |
          rm .github/workflows/garmin-gear-forward-port.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/garmin-gear-forward-port.yml
          git commit -m "feat(gear): wire M1 normalized source records"
          git push origin HEAD:feature/garmin-gear
