name: Patch Garmin sensor battery support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Patch client and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('src/ha_garmin/client.py')
          test_path = Path('tests/test_client.py')
          client = client_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          device_keys = '''DEVICE_ESSENTIAL_KEYS = {
              "deviceId",
              "unitId",
              "displayName",
              "productDisplayName",
              "applicationKey",
              "serialNumber",
              "partNumber",
              "productSku",
              "imageUrl",
              "primary",
              "primaryActivityTrackerIndicator",
              "deviceCategories",
              "wifi",
          }
          '''
          sensor_keys = device_keys + '''
          # Recent ANT+/BLE sensor payloads are small, but keep a stable explicit
          # schema for coordinator consumers. ``serialNumber`` is retained as an
          # internal identity candidate; diagnostics/UI layers may redact or omit it.
          SENSOR_ESSENTIAL_KEYS = {
              "deviceName",
              "imageUrl",
              "batteryStatus",
              "batteryLevel",
              "sensorType",
              "prioritySensor",
              "serialNumber",
              "productId",
              "partNumber",
              "softwareVersion",
              "lastConnected",
              "lastLowBatteryNotification",
              "manufacturer",
              "rechargeableSensorCapable",
          }
          '''
          client = replace_once(client, device_keys, sensor_keys, 'DEVICE_ESSENTIAL_KEYS')

          client = replace_once(
              client,
              '    "lastUpdated",\n}',
              '    "lastUpdated",\n    "lastConnected",\n}',
              'lastConnected datetime field',
          )

          trim_anchor = 'def _is_cycling_activity(activity: dict[str, Any]) -> bool:\n'
          trim_sensor = (
              'def _trim_sensor(sensor: dict[str, Any]) -> dict[str, Any]:\n'
              '    """Trim and normalize a recent ANT+/BLE sensor payload."""\n'
              '    trimmed = {k: v for k, v in sensor.items() if k in SENSOR_ESSENTIAL_KEYS}\n'
              '    return _convert_datetime_fields(trimmed)\n\n\n'
              + trim_anchor
          )
          client = replace_once(client, trim_anchor, trim_sensor, '_trim_sensor insertion')

          client = replace_once(
              client,
              '        """Fetch gear data: gear, defaults, stats, alarms, solar, devices.\n',
              '        """Fetch gear, Garmin devices and recently used ANT+/BLE sensors.\n',
              'fetch_gear_data summary',
          )
          client = replace_once(
              client,
              '                   get_devices, get_device_alarms, get_device_solar_data×N,\n                   get_device_last_used\n',
              '                   get_devices, get_sensors, get_device_alarms,\n                   get_device_solar_data×N, get_device_last_used\n',
              'fetch_gear_data API list',
          )

          device_line = '        trimmed_devices = [_trim_device(d) for d in devices]\n'
          sensor_block = device_line + ''.join([
              '\n',
              '        # Garmin Connect exposes recently used ANT+/BLE accessories separately\n',
              '        # from registered Garmin devices. The list carries battery level/status\n',
              '        # and last-connected time when the accessory reports them.\n',
              '        sensors = await self._safe_call(self.get_sensors) or []\n',
              '        trimmed_sensors = [\n',
              '            _trim_sensor(sensor)\n',
              '            for sensor in sensors\n',
              '            if isinstance(sensor, dict)\n',
              '        ]\n',
          ])
          client = replace_once(client, device_line, sensor_block, 'trimmed_devices')

          client = replace_once(
              client,
              '            "devices": trimmed_devices,\n',
              '            "devices": trimmed_devices,\n            "sensors": trimmed_sensors,\n',
              'devices return field',
          )

          # Existing fetch_gear_data tests must not call Garmin over the network.
          device_mock = '            patch.object(client, "get_devices", AsyncMock(return_value=[])),\n'
          sensor_mock = device_mock + '            patch.object(client, "get_sensors", AsyncMock(return_value=[])),\n'
          if device_mock not in tests:
              raise SystemExit('No get_devices test mocks found')
          tests = tests.replace(device_mock, sensor_mock)

          marker = '    async def test_fetch_gear_data_prefers_v2_usage_metadata(self):\n'
          added_test = ''.join([
              '    async def test_fetch_gear_data_includes_recent_sensor_battery_data(self):\n',
              '        """Recent ANT+/BLE sensors are normalized into the gear coordinator."""\n',
              '        auth = _make_auth()\n',
              '        client = GarminClient(auth)\n',
              '        profile = MagicMock(profile_id=None)\n',
              '        sensor_payload = {\n',
              '            "deviceName": None,\n',
              '            "imageUrl": None,\n',
              '            "batteryStatus": "OK",\n',
              '            "batteryLevel": 75,\n',
              '            "sensorType": "HEART_RATE",\n',
              '            "prioritySensor": False,\n',
              '            "serialNumber": "123456",\n',
              '            "productId": None,\n',
              '            "partNumber": None,\n',
              '            "softwareVersion": "0.3",\n',
              '            "lastConnected": "2026-08-16T13:26:00.0",\n',
              '            "lastLowBatteryNotification": None,\n',
              '            "manufacturer": None,\n',
              '            "rechargeableSensorCapable": None,\n',
              '            "unexpectedField": "drop-me",\n',
              '        }\n\n',
              '        with (\n',
              '            patch.object(client, "get_user_profile", AsyncMock(return_value=profile)),\n',
              '            patch.object(client, "get_devices", AsyncMock(return_value=[])),\n',
              '            patch.object(client, "get_sensors", AsyncMock(return_value=[sensor_payload])),\n',
              '            patch.object(client, "get_device_last_used", AsyncMock(return_value={})),\n',
              '            patch.object(client, "get_device_alarms", AsyncMock(return_value=[])),\n',
              '        ):\n',
              '            data = await client.fetch_gear_data()\n\n',
              '        assert len(data["sensors"]) == 1\n',
              '        sensor = data["sensors"][0]\n',
              '        assert sensor["sensorType"] == "HEART_RATE"\n',
              '        assert sensor["batteryLevel"] == 75\n',
              '        assert sensor["batteryStatus"] == "OK"\n',
              '        assert sensor["serialNumber"] == "123456"\n',
              '        assert sensor["lastConnected"] == datetime(\n',
              '            2026, 8, 16, 13, 26, tzinfo=UTC\n',
              '        )\n',
              '        assert "unexpectedField" not in sensor\n\n',
          ])
          if marker not in tests:
              raise SystemExit('Gear test insertion marker not found')
          tests = tests.replace(marker, added_test + marker, 1)

          client_path.write_text(client)
          test_path.write_text(tests)
          PY

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format and validate
        run: |
          ruff format src tests
          ruff check src tests
          mypy src
          pytest tests/test_client.py -q

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-garmin-sensor-battery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose recent Garmin sensor battery data'
          git push origin main
