name: One-shot Gear v2 UUID normalization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-gear-v2-uuid.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Normalize Gear v2 UUID path and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path("src/ha_garmin/client.py")
          text = client.read_text()
          old = '''        _validate_uuid(gear_uuid, "gear_uuid")\n        url = f"{GEAR_V2_URL}/{gear_uuid}"\n        data = await self._request("GET", url)\n'''
          new = '''        validated_uuid = _validate_uuid(gear_uuid, "gear_uuid")\n        normalized_uuid = validated_uuid.replace("-", "")\n        canonical_uuid = (\n            f"{normalized_uuid[:8]}-{normalized_uuid[8:12]}-{normalized_uuid[12:16]}-"\n            f"{normalized_uuid[16:20]}-{normalized_uuid[20:]}"\n        )\n        url = f"{GEAR_V2_URL}/{canonical_uuid}"\n        data = await self._request("GET", url)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"client.py Gear v2 block match count: {text.count(old)}")
          client.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_client.py")
          text = tests.read_text()
          anchor = '''    async def test_get_gear_details_uses_v2_endpoint(self):\n'''
          test = '''    async def test_get_gear_details_canonicalizes_compact_uuid(self):\n        """Garmin Gear v2 receives canonical hyphenated UUID paths."""\n        auth = _make_auth()\n        client = GarminClient(auth)\n        compact_uuid = "afedeef9264e42609dd10073b30fcdc8"\n        canonical_uuid = "afedeef9-264e-4260-9dd1-0073b30fcdc8"\n\n        with patch.object(client, "_request", new_callable=AsyncMock) as mock_request:\n            mock_request.return_value = {"uuid": canonical_uuid}\n            result = await client.get_gear_details(compact_uuid)\n\n        assert result["uuid"] == canonical_uuid\n        assert mock_request.call_args.args[1].endswith(\n            f"/gear-service/gear/v2/{canonical_uuid}"\n        )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"test anchor match count: {text.count(anchor)}")
          tests.write_text(text.replace(anchor, test + anchor, 1))
          PY

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format, lint and test
        run: |
          ruff format src tests
          ruff check src tests
          mypy src
          pytest tests/test_client.py -q

      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-gear-v2-uuid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ha_garmin/client.py tests/test_client.py .github/workflows/patch-gear-v2-uuid.yml
          git commit -m "fix: canonicalize Garmin Gear v2 UUID paths"
          git push
